name: Synthetic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      - run: uv pip install --python .venv/bin/python -r requirements.lock
      - run: uv pip install --python .venv/bin/python -r requirements-dev.lock
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: .venv/bin/python -m compileall -q app.py tests
      - run: .venv/bin/mypy
      - run: .venv/bin/python -m build
      - run: .venv/bin/ruff check app.py tests
      - run: .venv/bin/ruff format --check app.py tests
