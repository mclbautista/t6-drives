[project]
name = "t6-drives"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography==46.0.3",
    "gunicorn==23.0.0",
    "flask==3.1.3",
    "t6 @ git+https://github.com/mclbautista/t6-core.git@767c2390485299c0e0de22353548b21a0c3f819e",
    "segno==1.6.6",
]

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "mypy==1.19.1",
    "playwright==1.57.0",
    "build==1.3.0",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
    "pillow==12.3.0",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.6",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
files = ["app.py", "gateway.py", "forms.py", "outbox.py", "custody.py", "catalog.py", "shipments.py", "reload.py", "runtime.py", "glossary.py", "movement_photos.py", "tools", "tests"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "gateway", "forms", "outbox", "custody", "catalog", "shipments", "reload", "runtime", "glossary", "movement_photos"]
