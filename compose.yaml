# Loopback by default; the office-network address only as decided in #17; never 0.0.0.0.
services:
  app:
    # Immutable locally built image ID, or independently verified registry digest.
    image: ${DRIVES_IMAGE:?Set an immutable sha256 image ID or repository@sha256 digest}
    pull_policy: never
    ports:
      - "${DRIVES_BIND:-127.0.0.1}:${DRIVES_PORT:-5000}:8080"
    environment:
      DRIVES_OUTBOX: /data/outbox.json
      T6_API_URL: ${T6_API_URL:?Set the t6 API address}
      T6_API_SECRET: ${T6_API_SECRET:?Set the t6 API secret bound to the custodian}
      DRIVES_SESSION_SECRET: ${DRIVES_SESSION_SECRET:?Set a private runtime secret}
      DRIVES_ALLOWED_HOST: ${DRIVES_ALLOWED_HOST:-}
      DRIVES_HELPER_TOKEN: ${DRIVES_HELPER_TOKEN:-}
    volumes:
      - drives_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    restart: "no"
    stop_grace_period: 30s
volumes:
  drives_data:
