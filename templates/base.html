<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Drives{% endblock %} - Drives</title>
<style>{% include "_style.css" %}</style>
</head>
<body>
{% set path = request.path %}
<a class="skip" href="#main">Skip to content</a>
<header class="site">
<div class="wrap bar">
<a class="brand" href="/">Drives</a>
<nav aria-label="Main">
<a href="/inbox"{% if path == "/inbox" %} aria-current="page"{% endif %}>Inbox</a>
<a href="/"{% if path == "/" or path == "/new" or path.startswith("/drive/") %} aria-current="page"{% endif %}>Search</a>
<a href="/projects"{% if path.startswith("/projects") %} aria-current="page"{% endif %}>Projects</a>
<a href="/movements"{% if path.startswith("/movements") %} aria-current="page"{% endif %}>Movements</a>
<a href="/exceptions"{% if path == "/exceptions" %} aria-current="page"{% endif %}>Exceptions</a>
<a href="/outbox"{% if path == "/outbox" %} aria-current="page"{% endif %}>{{ words.WAITING_TO_SEND }}</a>
</nav>
</div>
</header>
<main id="main" class="wrap" tabindex="-1">
{% if practice %}<p class="practice">Practice: records are wiped at the next reload</p>{% endif %}
{% block content %}{% endblock %}
</main>
<script>
(function () {
  var wait;
  document.addEventListener("input", function (event) {
    var box = event.target;
    if (!box.matches || !box.matches("[data-person-picker]")) return;
    clearTimeout(wait);
    wait = setTimeout(function () {
      fetch("/people/find?q=" + encodeURIComponent(box.value), { headers: { Accept: "application/json" } })
        .then(function (r) { return r.ok ? r.json() : { people: [] }; })
        .then(function (found) {
          var list = document.getElementById(box.getAttribute("list"));
          list.textContent = "";
          found.people.forEach(function (p) {
            var option = document.createElement("option");
            option.value = p.name;
            if (p.handle) option.label = p.name + " (" + p.handle + ")";
            list.appendChild(option);
          });
        })
        .catch(function () {});
    }, 150);
  });
})();
</script>
</body>
</html>
