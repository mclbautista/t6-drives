[project]
name = "t6-drives"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["gunicorn==23.0.0", "flask==3.1.3", "t6[drives] @ git+https://github.com/mclbautista/t6-core.git@f4b7618c2eb14bb5f85ea3c1fa597843448bc3af"]

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "mypy==1.19.1",
    "playwright==1.57.0",
    "build==1.3.0",
    "types-openpyxl==3.1.5.20250919",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
files = ["app.py", "assignments.py", "custody.py", "shipments.py", "import_store.py", "imports.py", "imported_shipments.py", "runtime.py", "tools", "tests"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "assignments", "custody", "shipments", "import_store", "imports", "imported_shipments", "runtime"]
